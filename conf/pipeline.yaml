# Pipeline configuration.
#
# Zones map to S3 prefixes in AWS (s3://<bucket>/<zone>/...) and to local
# folders when running on a laptop. Override the root with CLAIMS_ROOT, e.g.
#   CLAIMS_ROOT=s3://acme-claims-dev
#
# The PHI vault is a separate zone (in AWS: a separate bucket with its own KMS
# key and a much narrower IAM policy) and holds the only copy of direct identifiers.

storage:
  root: ./data
  zones:
    raw: raw
    cleansed: cleansed
    curated: curated
    quarantine: quarantine
    phi_vault: phi_vault
    audit: audit/pipeline_runs

phi:
  # HMAC key for deterministic tokenization. In AWS this comes from Secrets
  # Manager (secret id below); locally it falls back to the env var.
  secret_id: claims-pipeline/phi-tokenization-key
  key_env_var: PHI_TOKEN_KEY
  # Safe Harbor style generalization applied to the analytics copy of the data.
  drop_columns: [first_name, last_name, ssn, address_line1, phone]
  zip_digits_kept: 3
  age_bands: [0, 18, 35, 50, 65, 200]

reference:
  # Reasonable-ness checks for a single claim line.
  max_line_paid: 50000
  max_days_supply: 90

quality_rules:
  members:
    - { name: member_id_not_null, type: not_null, column: member_id }
    - { name: dob_not_in_future, type: expression, expr: "date_of_birth <= current_date()" }
    - { name: gender_valid, type: accepted_values, column: gender, values: [F, M, U] }
    - { name: zip_format, type: regex, column: zip_code, pattern: '^[0-9]{5}$' }
  providers:
    - { name: npi_not_null, type: not_null, column: npi }
    - { name: npi_check_digit, type: expression, expr: "is_valid_npi" }
  claims:
    - { name: claim_id_not_null, type: not_null, column: claim_id }
    - { name: member_known, type: foreign_key, column: member_id, reference: members, reference_column: member_id }
    - { name: npi_check_digit, type: expression, expr: "billing_npi_valid" }
    - { name: dx_present, type: expression, expr: "size(diagnosis_codes) > 0" }
    - { name: dx_icd10_format, type: expression, expr: "invalid_dx_count = 0" }
    - { name: service_not_in_future, type: expression, expr: "service_from_date <= to_date(received_ts)" }
    - { name: service_dates_ordered, type: expression, expr: "service_to_date >= service_from_date" }
    - { name: frequency_code_valid, type: accepted_values, column: frequency_code, values: ['1', '7', '8'] }
    - { name: adjustment_has_original, type: expression, expr: "frequency_code = '1' OR original_claim_id IS NOT NULL" }
  claim_lines:
    - { name: claim_id_not_null, type: not_null, column: claim_id }
    - { name: cpt_format, type: regex, column: procedure_code, pattern: '^[0-9]{4}[0-9A-Z]$' }
    - { name: units_positive, type: range, column: units, min: 1 }
    - { name: paid_not_negative, type: range, column: paid_amount, min: 0 }
    - { name: paid_le_allowed, type: expression, expr: "paid_amount <= allowed_amount" }
    - { name: paid_reasonable, type: range, column: paid_amount, max: 50000 }
  pharmacy:
    - { name: rx_claim_id_not_null, type: not_null, column: rx_claim_id }
    - { name: member_known, type: foreign_key, column: member_id, reference: members, reference_column: member_id }
    - { name: ndc_format, type: regex, column: ndc, pattern: '^[0-9]{4,5}-[0-9]{3,4}-[0-9]{1,2}$' }
    - { name: days_supply_valid, type: range, column: days_supply, min: 1, max: 90 }
    - { name: paid_not_negative, type: range, column: paid_amount, min: 0 }

marts:
  high_cost_threshold: 5000
