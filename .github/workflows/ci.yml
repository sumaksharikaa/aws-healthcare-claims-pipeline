name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install
        run: pip install -e ".[local,dev]"

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Tests (unit + end-to-end)
        run: pytest -q

      - name: Validate Step Functions definition is JSON
        run: python -m json.tool infra/step_functions/claims_pipeline.asl.json > /dev/null

      - name: Build wheel
        run: pip wheel . --no-deps -w dist/

      - uses: actions/upload-artifact@v4
        with:
          name: wheel
          path: dist/*.whl

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform init -backend=false
      - run: terraform validate
