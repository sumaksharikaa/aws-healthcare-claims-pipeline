[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aws-healthcare-claims-pipeline"
version = "1.0.0"
description = "AWS Glue-style PySpark pipeline for healthcare claims: S3 zones, PHI tokenization, data quality, Redshift marts, Step Functions"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
# pyspark is provided by the AWS Glue runtime; boto3 too.
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
local = ["pyspark==3.5.3", "pyarrow>=14"]
aws = ["boto3>=1.34"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
claims-pipeline = "claims_pipeline.pipeline:main"
claims-redshift-load = "claims_pipeline.redshift:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "data_generator"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B", "SIM"]
"src/claims_pipeline/jobs/*" = ["E402"]
